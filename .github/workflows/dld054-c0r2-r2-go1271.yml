name: DLD-054 C0R2 Go1271 rebuild
on:
  push:
    branches: [dld-054-c0r2-r2-offline-build]
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CANDIDATE: cb8ecd707a4bf4e726e052936797e00e98755e47
  BASELINE: df08694965774a31041d6bd55915215568055908
  SOURCE_SHA: ee0502ded77ed5d2944f8ec1613525e66ff7566cb58280038cceab76086e2b18
  BUILT_AT: '1788674400'
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with: {persist-credentials: false, fetch-depth: 1}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: {go-version: '1.27.1', cache: false}
      - name: Exact source, tests, build, Windows PowerShell 5.1 smoke
        shell: powershell
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
          CGO_ENABLED: '0'
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts\runtime,artifacts\provenance,artifacts\smoke | Out-Null
          $parts=@(Get-ChildItem -LiteralPath 'security-build-inputs\source-b64-parts' -Filter '*.part' | Sort-Object Name)
          if($parts.Count -ne 5){throw "expected 5 source chunks, got $($parts.Count)"}
          $encoded=($parts | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw }) -join ''
          $z=Join-Path $env:RUNNER_TEMP 'DLD-054-C0R2-CANDIDATE-SOURCE-r1.zip'
          [IO.File]::WriteAllBytes($z,[Convert]::FromBase64String($encoded))
          $zh=(Get-FileHash $z -Algorithm SHA256).Hash.ToLowerInvariant()
          if($zh -cne $env:SOURCE_SHA){throw "decoded exact source hash mismatch: $zh"}
          Copy-Item $z artifacts\provenance\DLD-054-C0R2-OWNEDKEYS-DIAGNOSTIC-RUNTIME-SOURCE-CANDIDATE-r1.zip
          Expand-Archive $z source
          $src=(Resolve-Path 'source\c0r2runtime').Path
          git -C $src init -q; git -C $src config core.autocrlf false; git -C $src config user.name 'DLD C0R2 Offline Builder'; git -C $src config user.email 'dld-c0r2@example.invalid'; git -C $src add -A
          $env:GIT_AUTHOR_NAME='DLD C0R2 Offline Builder';$env:GIT_AUTHOR_EMAIL='dld-c0r2@example.invalid';$env:GIT_COMMITTER_NAME=$env:GIT_AUTHOR_NAME;$env:GIT_COMMITTER_EMAIL=$env:GIT_AUTHOR_EMAIL;$env:GIT_AUTHOR_DATE='2026-09-06T04:30:00Z';$env:GIT_COMMITTER_DATE=$env:GIT_AUTHOR_DATE
          git -C $src commit -q -m 'DLD-054: source-first C0R2 OwnedKeys diagnostic candidate r1'
          $head=(git -C $src rev-parse HEAD).Trim(); if($head -cne $env:CANDIDATE){throw "candidate commit mismatch $head"}; if(@(git -C $src status --porcelain).Count){throw 'dirty source'}
          if((go env GOVERSION).Trim() -cne 'go1.27.1'){throw 'wrong Go'}
          go version | Out-File -Encoding ascii artifacts\provenance\go-version.txt
          go -C $src test -count=1 -v ./... 2>&1 | Tee-Object artifacts\provenance\offline-tests-go1271.txt; if($LASTEXITCODE){throw 'tests failed'}
          go -C $src vet ./... 2>&1 | Tee-Object artifacts\provenance\go-vet-go1271.txt; if($LASTEXITCODE){throw 'vet failed'}
          if(@(git -C $src status --porcelain).Count){throw 'dirty after tests'}
          $env:GOOS='windows';$env:GOARCH='amd64';$env:GOAMD64='v1'
          $bi='dld.local/c0r2runtime/internal/buildinfo'; $ld="-X $bi.Version=c0r2-ownedkeys-diag-r2 -X $bi.BuiltAt=$env:BUILT_AT -X $bi.Commit=$env:CANDIDATE -X $bi.Baseline=$env:BASELINE"
          $a=Join-Path $env:RUNNER_TEMP a.exe;$b=Join-Path $env:RUNNER_TEMP b.exe
          go -C $src build -mod=readonly -trimpath -buildvcs=true -ldflags $ld -o $a ./cmd/c0r2runtime; if($LASTEXITCODE){throw 'build A failed'}
          go -C $src build -mod=readonly -trimpath -buildvcs=true -ldflags $ld -o $b ./cmd/c0r2runtime; if($LASTEXITCODE){throw 'build B failed'}
          $ha=(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant();$hb=(Get-FileHash $b -Algorithm SHA256).Hash.ToLowerInvariant();if($ha -cne $hb){throw 'nondeterministic build'}
          Copy-Item $a artifacts\runtime\c0r2-ownedkeys-diag-r2.exe
          "$ha  c0r2-ownedkeys-diag-r2.exe"|Out-File -Encoding ascii artifacts\runtime\c0r2-ownedkeys-diag-r2.exe.sha256.txt
          "build_a_sha256=$ha`nbuild_b_sha256=$hb`nbyte_for_byte_identical=YES"|Out-File -Encoding ascii artifacts\provenance\deterministic-rebuild.txt
          "builder=go1.27.1`nGOTOOLCHAIN=local`nGOPROXY=off`nGOSUMDB=off`nGOOS=windows`nGOARCH=amd64`nGOAMD64=v1`nCGO_ENABLED=0`nbuild_tags=NONE`nmod=readonly`ntrimpath=true`nbuildvcs=true`nBuiltAt=$env:BUILT_AT`nCandidate=$env:CANDIDATE`nBaseline=$env:BASELINE`nldflags=$ld"|Out-File -Encoding ascii artifacts\provenance\build-command.txt
          go version -m artifacts\runtime\c0r2-ownedkeys-diag-r2.exe | Out-File -Encoding utf8 artifacts\provenance\go-version-m.txt
          $m=Get-Content artifacts\provenance\go-version-m.txt -Raw;if($m -notmatch 'go1\.27\.1' -or $m -notmatch 'vcs\.revision=cb8ecd707a4bf4e726e052936797e00e98755e47' -or $m -notmatch 'vcs\.modified=false'){throw 'build metadata mismatch'}
          "candidate_commit=$head`nbaseline_commit=$env:BASELINE`nsource_zip_sha256=$zh`nsource_bytes_changed=NO`nhistorical_c0r_reconstruction=NO"|Out-File -Encoding ascii artifacts\provenance\source-identity.txt
          if($PSVersionTable.PSVersion.ToString() -notlike '5.1*'){throw "requires Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"}
          $state=Join-Path $env:RUNNER_TEMP empty-providerstate;if(Test-Path $state){Remove-Item $state -Recurse -Force};New-Item -ItemType Directory $state|Out-Null
          $psi=New-Object Diagnostics.ProcessStartInfo;$psi.FileName=(Resolve-Path artifacts\runtime\c0r2-ownedkeys-diag-r2.exe).Path;$psi.Arguments='daemon --json --transport stdio';$psi.UseShellExecute=$false;$psi.CreateNoWindow=$true;$psi.RedirectStandardInput=$true;$psi.RedirectStandardOutput=$true;$psi.RedirectStandardError=$true;$psi.EnvironmentVariables['DLD_PROVIDER_STATE_DIR']=$state
          $p=New-Object Diagnostics.Process;$p.StartInfo=$psi;$started=$false
          try{
            $started=$p.Start();if(-not $started){throw 'start failed'};Start-Sleep -Milliseconds 300;if($p.HasExited){throw 'early exit'}
            $tcp=@(Get-NetTCPConnection -ErrorAction Stop|? OwningProcess -eq $p.Id);$udp=@(Get-NetUDPEndpoint -ErrorAction Stop|? OwningProcess -eq $p.Id);if($tcp.Count -or $udp.Count){throw 'unexpected network endpoint'}
            $payload='{"jsonrpc":"2.0","id":1,"method":"Version.Get","params":{}}'.Replace('\"','"')+"`n"+'{"jsonrpc":"2.0","id":2,"method":"Meta.Shutdown","params":{}}'.Replace('\"','"')+"`n";$bytes=[Text.Encoding]::ASCII.GetBytes($payload);$stdin=$p.StandardInput.BaseStream;$stdin.Write($bytes,0,$bytes.Length);$stdin.Flush();$stdin.Close();if(-not $p.WaitForExit(10000)){throw 'shutdown timeout'}
            $out=$p.StandardOutput.ReadToEnd();$err=$p.StandardError.ReadToEnd();$out|Out-File -Encoding utf8 artifacts\smoke\stdio.txt;$err|Out-File -Encoding utf8 artifacts\smoke\stderr.txt;if($p.ExitCode){throw "exit $($p.ExitCode)"}
            $lines=@($out -split "`r?`n"|?{-not [string]::IsNullOrWhiteSpace($_)});if($lines.Count -ne 2){throw "response count $($lines.Count)"}
            $responses=@($lines|%{$_|ConvertFrom-Json});$vr=@($responses|?{[string]$_.id -eq '1'});$sr=@($responses|?{[string]$_.id -eq '2'});if($vr.Count -ne 1 -or $sr.Count -ne 1){throw 'expected response ids missing'};$v=$vr[0];$s=$sr[0]
            if(($v.PSObject.Properties.Name -contains 'error') -and $null -ne $v.error){throw 'Version.Get RPC error'};if(-not ($v.PSObject.Properties.Name -contains 'result')){throw 'Version.Get result missing'}
            if(($s.PSObject.Properties.Name -contains 'error') -and $null -ne $s.error){throw 'Meta.Shutdown RPC error'};if(-not ($s.PSObject.Properties.Name -contains 'result')){throw 'Meta.Shutdown result missing'}
            $vs=[string]$v.result.versionString;if($vs -notlike '*c0r2-ownedkeys-diag-r2*' -or $vs -notlike "*$env:CANDIDATE*" -or $vs -notlike "*$env:BASELINE*"){throw 'version identity'}
            Start-Sleep -Milliseconds 250;$post=@(Get-Process -ErrorAction Stop|?{$_.Id -eq $p.Id -or $_.ProcessName -eq 'c0r2-ownedkeys-diag-r2'});if($post.Count){throw 'process remains'};if(@(Get-ChildItem $state -Force).Count){throw 'ProviderState mutated'}
            [ordered]@{schema=1;binarySha256=$ha;windowsPowerShellVersion=$PSVersionTable.PSVersion.ToString();processStart='PASS';processArgumentConstruction='ProcessStartInfo.Arguments';isolatedProviderState='EMPTY_TEMP_DIRECTORY';versionGetUsed='1/1';versionIdentity=$vs;metaShutdownUsed='1/1';profileOwnedKeysUsed='0/1';providerHttp=0;runtimeTcpEndpointCountObserved=$tcp.Count;runtimeUdpEndpointCountObserved=$udp.Count;realProviderStateUse=0;realCredentialUse=0;oauth=0;rawSecretOutput=0;processExitCode=$p.ExitCode;finalProcessCount=$post.Count;smokeResult='PASS_NONPROVIDER_ONLY'}|ConvertTo-Json|Out-File -Encoding utf8 artifacts\smoke\WINDOWS-NATIVE-NONPROVIDER-SMOKE.json
          }catch{
            Write-Host 'SANITIZED_SMOKE_STDOUT_BEGIN';if(Test-Path artifacts\smoke\stdio.txt){Get-Content artifacts\smoke\stdio.txt};Write-Host 'SANITIZED_SMOKE_STDOUT_END';throw
          }finally{if($started -and -not $p.HasExited){$p.Kill();$p.WaitForExit(5000)|Out-Null};$p.Dispose()}
          "Version.Get`nMeta.Shutdown`nFetch.ProfileOwnedKeys`nOAuth=0`nFetch.ProfileOwnedKeys_executed=0`nprovider_http=0`nreal_providerstate=0`nreal_credentials=0"|Out-File -Encoding ascii artifacts\provenance\rpc-live-boundary.txt
          Get-ChildItem artifacts -Recurse -File|%{$h=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant();$r=$_.FullName.Substring((Resolve-Path artifacts).Path.Length+1).Replace('\','/');"$h  $r"}|Sort-Object|Out-File -Encoding ascii artifacts\SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dld054-c0r2-r2-go1271-security-prep
          path: artifacts
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
