name: DLD Windows unsigned trusted build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows-amd64:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache: false
      - name: Record and enforce public-candidate privacy/linkability gate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/provenance | Out-Null
          $report = New-Object System.Collections.Generic.List[string]
          $report.Add("candidate_sha=$env:GITHUB_SHA")
          $report.Add("event=$env:GITHUB_EVENT_NAME")
          $legacyOwner = 'tree' + '-1508'
          $legacyRepo = 'github.com/' + $legacyOwner + '/dlm-butler-runtime'
          $legacyCommit = '616652180ebacedb44b70150' + 'b4f995c5f7d9be67'
          $forbidden = @($legacyOwner, $legacyRepo, $legacyCommit)
          foreach ($needle in $forbidden) {
            $blobHits = @(git grep -I -l -F -- $needle HEAD -- 2>$null)
            if ($LASTEXITCODE -notin @(0,1)) { throw "git grep failed for privacy needle: $needle" }
            if ($blobHits.Count -gt 0) {
              $report.Add("FAIL tracked-blob forbidden indicator: $needle")
              $report.AddRange([string[]]$blobHits)
              $report | Out-File -Encoding utf8 artifacts/provenance/privacy-linkability-scan.txt
              throw 'Privacy/linkability gate failed in tracked blobs.'
            }
            $messageHits = @(git log HEAD --format='%H%x09%B' | Select-String -SimpleMatch $needle)
            if ($messageHits.Count -gt 0) {
              $report.Add("FAIL commit-message forbidden indicator: $needle")
              $report | Out-File -Encoding utf8 artifacts/provenance/privacy-linkability-scan.txt
              throw 'Privacy/linkability gate failed in commit messages.'
            }
          }
          if ($env:GITHUB_EVENT_NAME -ne 'pull_request') {
            $bad = @()
            foreach ($line in @(git log HEAD --format='%H%x09%an%x09%ae%x09%cn%x09%ce')) {
              $p = $line -split "`t", 5
              if ($p.Count -ne 5) { throw 'Unexpected git log identity record.' }
              if ($p[1] -ne 'Ertelun' -or $p[2] -ne 'noreply@ertelun.invalid' -or $p[3] -ne 'Ertelun' -or $p[4] -ne 'noreply@ertelun.invalid') { $bad += $p[0] }
            }
            if ($bad.Count -gt 0) {
              $report.Add("FAIL unexpected canonical commit identity in: $($bad -join ',')")
              $report | Out-File -Encoding utf8 artifacts/provenance/privacy-linkability-scan.txt
              throw 'Canonical commit identity gate failed.'
            }
          }
          $tags = @(git tag --list)
          if ($tags.Count -ne 0) {
            $report.Add("FAIL unexpected pre-release tag(s): $($tags -join ',')")
            $report | Out-File -Encoding utf8 artifacts/provenance/privacy-linkability-scan.txt
            throw 'Unexpected tag metadata exists before release-tag protection gate.'
          }
          $report.Add('tracked_blob_linkability=PASS')
          $report.Add('commit_message_linkability=PASS')
          $report.Add('canonical_identity=PASS_OR_PR_DEFERRED')
          $report.Add('pre_release_tags=PASS_NONE')
          $report | Out-File -Encoding utf8 artifacts/provenance/privacy-linkability-scan.txt

      - name: Verify clean runtime dependency graph
        shell: pwsh
        run: |
          go -C dldruntime mod verify
          git diff --exit-code -- dldruntime/go.mod dldruntime/go.sum
          $forbidden = @('github.com/itchio/arkive','github.com/itchio/hades','github.com/itchio/hush','github.com/itchio/intact','github.com/itchio/kompress','github.com/itchio/screw')
          $graph = go -C dldruntime list -m all
          foreach ($module in $forbidden) {
            if ($graph -match [regex]::Escape($module)) { throw "Forbidden unresolved-license module remains in clean graph: $module" }
          }

      - name: Build and test unsigned clean Windows runtime
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          $builtAt = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $bi = 'github.com/Ertelun/dlm-butler-runtime/dldruntime/internal/buildinfo'
          windres -o dldruntime/cmd/dldruntime/butler.syso butler.rc
          go -C dldruntime build -trimpath -ldflags "-X $bi.Version=$env:GITHUB_REF_NAME -X $bi.BuiltAt=$builtAt -X $bi.Commit=$env:GITHUB_SHA -w -s" -o ../butler.exe ./cmd/dldruntime
          go -C dldruntime test -v ./...
          New-Item -ItemType Directory -Force artifacts/windows-amd64 | Out-Null
          Move-Item -LiteralPath butler.exe -Destination artifacts/windows-amd64/butler.exe
          & artifacts/windows-amd64/butler.exe -V
          if ($LASTEXITCODE -ne 0) { throw 'clean runtime version probe failed' }

      - name: Assert exe-only artifact topology
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath artifacts/windows-amd64 -File)
          $names = @($files | ForEach-Object { $_.Name })
          if ($names.Count -ne 1 -or $names[0] -ne 'butler.exe') {
            throw "Expected exact exe-only artifact [butler.exe], got: $($names -join ', ')"
          }
          if (Test-Path -LiteralPath artifacts/windows-amd64/7z.dll) { throw '7z.dll must not be present' }
          if (Test-Path -LiteralPath artifacts/windows-amd64/c7zip.dll) { throw 'c7zip.dll must not be present' }

      - name: Prove stdio-only runtime and record listener/process evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/provenance | Out-Null
          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = (Resolve-Path 'artifacts/windows-amd64/butler.exe').Path
          $psi.ArgumentList.Add('daemon')
          $psi.ArgumentList.Add('--json')
          $psi.ArgumentList.Add('--transport')
          $psi.ArgumentList.Add('stdio')
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $proc = [System.Diagnostics.Process]::new()
          $proc.StartInfo = $psi
          if (-not $proc.Start()) { throw 'Failed to start DLD stdio runtime.' }
          try {
            Start-Sleep -Milliseconds 750
            if ($proc.HasExited) { throw "DLD stdio runtime exited prematurely with $($proc.ExitCode)." }
            $children = @(Get-CimInstance Win32_Process -Filter "ParentProcessId = $($proc.Id)" -ErrorAction Stop)
            $tcp = @(Get-NetTCPConnection -OwningProcess $proc.Id -State Listen -ErrorAction SilentlyContinue)
            $udp = @(Get-NetUDPEndpoint -OwningProcess $proc.Id -ErrorAction SilentlyContinue)
            @(
              "pid=$($proc.Id)",
              "path=$($psi.FileName)",
              "child_process_count=$($children.Count)",
              "tcp_listener_count=$($tcp.Count)",
              "udp_listener_count=$($udp.Count)"
            ) | Out-File -Encoding utf8 artifacts/provenance/runtime-process-summary.txt
            if ($children.Count -eq 0) { 'NONE' | Out-File -Encoding ascii artifacts/provenance/runtime-child-processes.txt } else { $children | Select-Object ProcessId,ParentProcessId,Name,ExecutablePath,CommandLine | Format-List | Out-File -Encoding utf8 artifacts/provenance/runtime-child-processes.txt }
            if ($tcp.Count -eq 0) { 'NONE' | Out-File -Encoding ascii artifacts/provenance/runtime-tcp-listeners.txt } else { $tcp | Select-Object LocalAddress,LocalPort,RemoteAddress,RemotePort,State,OwningProcess | Format-Table -AutoSize | Out-File -Encoding utf8 artifacts/provenance/runtime-tcp-listeners.txt }
            if ($udp.Count -eq 0) { 'NONE' | Out-File -Encoding ascii artifacts/provenance/runtime-udp-listeners.txt } else { $udp | Select-Object LocalAddress,LocalPort,OwningProcess | Format-Table -AutoSize | Out-File -Encoding utf8 artifacts/provenance/runtime-udp-listeners.txt }
            if ($children.Count -ne 0) { throw 'Unexpected child process(es) spawned by stdio runtime.' }
            if ($tcp.Count -ne 0) { throw 'Unexpected TCP listener(s) owned by stdio runtime.' }
            if ($udp.Count -ne 0) { throw 'Unexpected UDP listener(s) owned by stdio runtime.' }
            $proc.StandardInput.WriteLine('{"jsonrpc":"2.0","id":1,"method":"Version.Get","params":{}}')
            $proc.StandardInput.WriteLine('{"jsonrpc":"2.0","id":2,"method":"Meta.Shutdown","params":{}}')
            $proc.StandardInput.Flush()
            $proc.StandardInput.Close()
            if (-not $proc.WaitForExit(10000)) { throw 'DLD stdio runtime did not terminate after Meta.Shutdown.' }
            $stdout = $proc.StandardOutput.ReadToEnd()
            $stderr = $proc.StandardError.ReadToEnd()
            $stdout | Out-File -Encoding utf8 artifacts/provenance/runtime-stdio-responses.txt
            $stderr | Out-File -Encoding utf8 artifacts/provenance/runtime-stderr.txt
            if ($proc.ExitCode -ne 0) { throw "DLD stdio runtime exited with $($proc.ExitCode)." }
            if ($stdout -notmatch '"id":1' -or $stdout -notmatch '"versionString"') { throw 'Version.Get response missing.' }
            if ($stdout -notmatch '"id":2') { throw 'Meta.Shutdown response missing.' }
          } finally {
            if (-not $proc.HasExited) { $proc.Kill($true); $proc.WaitForExit() }
            $proc.Dispose()
          }

      - name: Record build identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/provenance | Out-Null
          git rev-parse HEAD | Out-File -Encoding ascii artifacts/provenance/git-commit.txt
          go version | Out-File -Encoding ascii artifacts/provenance/go-version.txt
          'Node/npm not used by the DLD clean trusted-build job' | Out-File -Encoding ascii artifacts/provenance/build-tooling-note.txt
          Get-FileHash artifacts/windows-amd64/butler.exe -Algorithm SHA256 | Format-List | Out-File -Encoding utf8 artifacts/provenance/butler-exe-sha256.txt
          Get-Item artifacts/windows-amd64/butler.exe | Select-Object Name,Length,LastWriteTimeUtc | Format-List | Out-File -Encoding utf8 artifacts/provenance/butler-exe-file.txt
          Get-ComputerInfo -Property OsName,OsVersion,WindowsVersion,OsBuildNumber | Format-List | Out-File -Encoding utf8 artifacts/provenance/runner-os.txt

      - name: Install pinned compliance tools
        shell: pwsh
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          cyclonedx-gomod version | Out-File -Encoding utf8 artifacts/provenance/cyclonedx-gomod-version.txt
          govulncheck -version | Out-File -Encoding utf8 artifacts/provenance/govulncheck-version.txt

      - name: Generate exact binary inventory, notices and corresponding source
        shell: pwsh
        run: |
          ./.github/scripts/dld051-compliance.ps1 -BinaryPath artifacts/windows-amd64/butler.exe -OutDir artifacts/compliance

      - name: Generate CycloneDX exact-binary and Windows-source SBOMs
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          cyclonedx-gomod bin -json -output artifacts/compliance/butler-exact-binary.cdx.json artifacts/windows-amd64/butler.exe
          $sourceSbom = (Resolve-Path artifacts/compliance).Path + '/butler-windows-amd64-source.cdx.json'
          Push-Location dldruntime
          try {
            cyclonedx-gomod app -licenses -json -output $sourceSbom -main ./cmd/dldruntime .
          } finally {
            Pop-Location
          }

      - name: Scan exact binary with govulncheck
        shell: pwsh
        continue-on-error: true
        run: |
          govulncheck -mode=binary -json artifacts/windows-amd64/butler.exe | Out-File -Encoding utf8 artifacts/compliance/govulncheck-exact-binary.json
          $code = $LASTEXITCODE
          "$code" | Out-File -Encoding ascii artifacts/compliance/govulncheck-exit-code.txt
          Write-Host "govulncheck exit code: $code"
          exit 0

      - name: Record vulnerability gate status
        shell: pwsh
        run: |
          $report = 'artifacts/compliance/govulncheck-exact-binary.json'
          if (-not (Test-Path -LiteralPath $report)) { throw 'govulncheck report is missing' }
          $findings = @(Select-String -LiteralPath $report -Pattern '"finding"\s*:' -AllMatches)
          $count = 0
          foreach ($line in $findings) { $count += $line.Matches.Count }
          "$count" | Out-File -Encoding ascii artifacts/compliance/govulncheck-finding-count.txt
          if ($count -eq 0) {
            'PASS' | Out-File -Encoding ascii artifacts/compliance/VULNERABILITY_GATE_STATUS.txt
          } else {
            'HOLD' | Out-File -Encoding ascii artifacts/compliance/VULNERABILITY_GATE_STATUS.txt
            Write-Warning "Exact butler.exe has $count govulncheck finding record(s)."
          }

      - name: Assert and enforce exact compliance closure
        shell: pwsh
        run: |
          $required = @('EXACT_BINARY_MODULES.tsv','LICENSE_MANIFEST.json','LICENSE_GATE_STATUS.txt','THIRD_PARTY_NOTICES.txt','dld-051-corresponding-source.zip','SHA256SUMS.txt','butler-exact-binary.cdx.json','butler-windows-amd64-source.cdx.json','govulncheck-exact-binary.json','govulncheck-finding-count.txt','VULNERABILITY_GATE_STATUS.txt')
          foreach ($name in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path artifacts/compliance $name))) { throw "Missing compliance artifact: $name" }
          }
          $license = (Get-Content artifacts/compliance/LICENSE_GATE_STATUS.txt -Raw).Trim()
          $vuln = (Get-Content artifacts/compliance/VULNERABILITY_GATE_STATUS.txt -Raw).Trim()
          if ($license -ne 'PASS' -or $vuln -ne 'PASS') { throw "DLD-051 exact compliance closure HOLD: license=$license vulnerability=$vuln" }
          Write-Host 'DLD-051 exact license and vulnerability gates PASS for this exact candidate.'

      - name: Assert privacy and runtime-isolation evidence closure
        shell: pwsh
        run: |
          $required = @(
            'artifacts/provenance/privacy-linkability-scan.txt',
            'artifacts/provenance/runtime-process-summary.txt',
            'artifacts/provenance/runtime-child-processes.txt',
            'artifacts/provenance/runtime-tcp-listeners.txt',
            'artifacts/provenance/runtime-udp-listeners.txt',
            'artifacts/provenance/runtime-stdio-responses.txt',
            'artifacts/provenance/runtime-stderr.txt'
          )
          foreach ($path in $required) { if (-not (Test-Path -LiteralPath $path)) { throw "Missing security evidence: $path" } }
          if ((Get-Content artifacts/provenance/runtime-child-processes.txt -Raw).Trim() -ne 'NONE') { throw 'Runtime child-process evidence is not clean.' }
          if ((Get-Content artifacts/provenance/runtime-tcp-listeners.txt -Raw).Trim() -ne 'NONE') { throw 'Runtime TCP-listener evidence is not clean.' }
          if ((Get-Content artifacts/provenance/runtime-udp-listeners.txt -Raw).Trim() -ne 'NONE') { throw 'Runtime UDP-listener evidence is not clean.' }
          if ((Get-Content artifacts/provenance/privacy-linkability-scan.txt -Raw) -notmatch 'tracked_blob_linkability=PASS') { throw 'Privacy/linkability evidence did not close.' }
          Write-Host 'Privacy/linkability and runtime-isolation evidence PASS.'
      - name: Upload unsigned runtime and compliance evidence before any signing request
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dld-windows-amd64-unsigned-compliance-${{ github.sha }}
          path: |
            artifacts/windows-amd64/
            artifacts/provenance/
            artifacts/compliance/
          retention-days: 30
          if-no-files-found: error
